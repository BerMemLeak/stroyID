name: Build macOS Apple Silicon
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu'
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      STROYID_SKIP_WORD_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
          cache: pip
      - name: Verify the official Python installer used by bootstrap
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 https://www.python.org/ftp/python/3.13.16/python-3.13.16-macos11.pkg -o "$RUNNER_TEMP/python-bootstrap.pkg"
          bash tools/verify_python_macos.sh "$RUNNER_TEMP/python-bootstrap.pkg"
      - name: Full setup, tests and local native app
        run: bash setup_and_build_macos.command --no-launch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-build-validation
          path: |
            release/build-report.json
            release/packaged-self-test.json
            release/word-macos-check.json
            logs/
          retention-days: 14
