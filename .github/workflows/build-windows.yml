name: Build Windows application
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, fix/document-workflow]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - name: Test, package and launch the isolated executable
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-validation
          path: |
            release/build-report.json
            release/packaged-self-test.json
            logs/
          retention-days: 14
