<!DOCTYPE html>
<html lang="ru">
<head>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>СтройИД — полная структура ИД</title><meta name="description" content="Объекты, инженерные системы, акты, схемы, материалы, испытания, журналы и сборка томов в едином HTML-прототипе."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%231e50d5%27/%3E%3Cpath d=%27M9 24V8h10l5 5v11zM13 17h7M13 21h7%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27/%3E%3C/svg%3E">
<style>
:root{--bg:#f3f4f6;--card:#fff;--line:#e3e6eb;--line2:#eef0f3;--tx:#161a1f;--tx2:#38404a;--mut:#6b7280;--acc:#2456c9;--acc-h:#1c46a6;--acc-s:#eaf0fd;--red:#bf3a2b;--red-s:#fdeeec;--amb:#9a5800;--amb-s:#fff3df;--grn:#1d7a3f;--grn-s:#e7f5ec;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
#app{display:grid;grid-template-columns:296px 1fr;height:100vh}
/* sidebar */
#side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 8px;font-weight:650;font-size:15.5px;color:var(--tx)}
.brand small{display:block;font-weight:400;color:var(--mut);font-size:11.5px;margin-top:-1px}
#tree{flex:1;overflow:auto;padding:2px 10px 14px}
.sh{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#8a919c;padding:16px 8px 6px;font-weight:600}
.sh button{border:0;background:none;color:var(--mut);cursor:pointer;width:22px;height:22px;border-radius:6px;font-size:16px;line-height:1}
.sh button:hover{background:#eef0f3;color:var(--acc)}
.tn{display:flex;align-items:center;gap:2px;min-height:30px;border-radius:7px;padding-right:6px}
.tn:hover{background:#f3f5f8}
.tn.on{background:var(--acc-s)}
.tn.on>a{color:var(--acc);font-weight:600}
.tn .tg{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;color:#9aa1ab;cursor:pointer;border-radius:4px}
.tn .tg svg{width:10px;height:10px;transition:transform .12s}
.tn .tg.o svg{transform:rotate(90deg)}
.tn .tg:hover{background:#e5e8ed}
.tn>a{flex:1;min-width:0;display:flex;align-items:center;gap:8px;color:var(--tx2);text-decoration:none;padding:5px 0}
.tn .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn .ct{margin-left:auto;font-size:11.5px;color:#8a919c;padding-left:6px;flex:none}
.tn.add>a{color:#8a919c;font-size:13px}
.tn.add>a:hover{color:var(--acc)}
.tn .warn{width:16px;height:16px;border-radius:50%;background:var(--amb-s);color:var(--amb);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.tn .err{background:var(--red-s);color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.g{background:#2fa35b}.dot.a{background:#e0a100}
.ic{width:16px;height:16px;flex:none;color:#7c8592}
.tn.on .ic{color:var(--acc)}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mut)}
.ava{width:28px;height:28px;border-radius:50%;background:#dfe7fb;color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:650;font-size:12px;flex:none}
/* main */
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{height:58px;flex:none;display:flex;align-items:center;gap:10px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line)}
.search{flex:1;max-width:520px;position:relative}
.search svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:#8a919c}
#top .search input{padding-left:36px;background:#f3f4f6;border-color:transparent}
#top .search input:focus{background:#fff}
#top .sp{flex:.2}
#content{flex:1;overflow:auto}
.page{max-width:1240px;margin:0 auto;padding:22px 28px 70px}
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.crumb{font-size:12.5px;color:var(--mut);margin-bottom:5px}
.crumb a{color:var(--mut)}.crumb a:hover{color:var(--acc)}
h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em;line-height:1.25}
.sub{color:var(--mut);margin-top:4px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:55%}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.tab{padding:9px 12px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;white-space:nowrap}
.tab:hover{color:var(--tx);text-decoration:none}
.tab.on{color:var(--acc);border-color:var(--acc)}
.tab .cnt{background:#eceef2;color:var(--mut);border-radius:10px;padding:1px 7px;font-size:11.5px;margin-left:6px}
.tab .cnt.r{background:var(--red-s);color:var(--red)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 18px;margin-bottom:16px}
.card>h3,.card>summary{margin:0 0 14px;font-size:14.5px;font-weight:620;display:flex;align-items:center;gap:8px}
.card>h3 .r,.card>summary .r{margin-left:auto;font-weight:400}
details.card>summary{cursor:pointer;list-style:none;margin:0}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary:before{content:"";width:7px;height:7px;border-right:2px solid #9aa1ab;border-bottom:2px solid #9aa1ab;transform:rotate(-45deg);margin-right:4px;transition:transform .12s}
details.card[open]>summary:before{transform:rotate(45deg)}
details.card[open]>summary{margin-bottom:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px}
.span2{grid-column:1/-1}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
/* controls */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12.5px;color:var(--mut);font-weight:500}
.fld small{color:var(--mut);font-size:12px}
.req{color:var(--red)}
input[type=text],input[type=date],input[type=number],input:not([type]),select,textarea{font:inherit;border:1px solid #d6dae1;border-radius:8px;padding:6px 10px;background:#fff;color:var(--tx);min-height:36px;width:100%;transition:border-color .12s,box-shadow .12s}
textarea{resize:vertical;line-height:1.4}
input:hover,select:hover,textarea:hover{border-color:#c3c8d1}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(36,86,201,.14)}
input[readonly]{background:#f6f7f9;color:var(--tx2)}
input[type=checkbox],input[type=radio]{accent-color:var(--acc);width:15px;height:15px;margin:0;vertical-align:-2px}
fieldset.wrap{border:0;margin:0;padding:0;min-width:0}
input:disabled,select:disabled,textarea:disabled{background:#f6f7f9;color:#666}
label.ck{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.btn{font:inherit;font-weight:500;height:34px;padding:0 14px;border-radius:8px;border:1px solid #d6dae1;background:#fff;color:var(--tx2);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:#f6f7f9;border-color:#c3c8d1;text-decoration:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-h)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mut)}
.btn.ghost:hover{background:#f0f2f5;color:var(--tx)}
.btn.sm{height:28px;padding:0 10px;font-size:13px;border-radius:7px}
.btn.dng{color:var(--red)}
.btn.icon{width:28px;padding:0;justify-content:center}
.btn svg{width:15px;height:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt{margin-top:12px}.mb{margin-bottom:12px}
.mut{color:var(--mut)}.small{font-size:12.5px}
.grow{flex:1}
/* tables */
.tw{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
.card .tw{border-radius:8px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:600;color:var(--mut);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap;position:sticky;top:0;z-index:1}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.cl{cursor:pointer}
.tbl tr.cl:hover td{background:#f7f9fc}
.tbl tr.sel td{background:#eef3fd!important}
.tbl .num{text-align:right;white-space:nowrap}
.tbl td input,.tbl td select{min-height:30px;padding:3px 8px}
.tbl tr.book td{background:#f1f4f9;font-weight:600;font-size:12.5px}
.tbl .t2{color:var(--mut);font-size:12.5px}
/* pills & alerts */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:500;white-space:nowrap;vertical-align:middle}
.p-g{background:var(--grn-s);color:var(--grn)}.p-a{background:var(--amb-s);color:var(--amb)}.p-r{background:var(--red-s);color:var(--red)}.p-n{background:#eef0f3;color:#4b5563}.p-b{background:var(--acc-s);color:var(--acc)}
.chk{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid #d6dae1;border-radius:15px;cursor:pointer;font-size:13px;user-select:none;background:#fff}
.chk.on{background:var(--acc-s);border-color:#b9cbf3;color:var(--acc);font-weight:500}
.alert{display:flex;gap:12px;align-items:center;border-radius:var(--r);padding:11px 14px;margin-bottom:16px;font-size:13.5px}
.alert .grow{min-width:0}
.al-a{background:var(--amb-s);color:#5f3700}.al-r{background:var(--red-s);color:#74190f}.al-g{background:var(--grn-s);color:#14532d}.al-b{background:var(--acc-s);color:#1e3a8a}
.checkpill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--tx2);font-size:13px;cursor:pointer}
.checkpill:hover{background:#f6f7f9;text-decoration:none}
.checkpill b{font-weight:600}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.01em}
.kpi .l{color:var(--mut);font-size:12.5px}
.sysg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;color:var(--tx);transition:border-color .12s,box-shadow .12s}
.sc:hover{border-color:#c6d3ef;box-shadow:0 2px 10px rgba(20,40,90,.06);text-decoration:none}
.sc .code{font-weight:700;font-size:16px}
.sc .nm{color:var(--mut);font-size:13px;margin-top:-6px}
.sc.new{align-items:center;justify-content:center;border-style:dashed;color:var(--mut);min-height:150px;cursor:pointer}
.sc.new:hover{color:var(--acc)}
.prog{height:6px;background:#eceef2;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:#2fa35b;border-radius:3px}
.objg{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.empty{padding:34px 20px;text-align:center;color:var(--mut);border:1px dashed #d6dae1;border-radius:var(--r);background:#fcfcfd}
.file{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fafbfc}
.file .fi{width:34px;height:40px;border-radius:5px;background:#fbe9e7;color:#c0392b;font-size:10px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;flex:none}
.file .fi.no{background:#eef0f3;color:#9aa1ab}
.file .nm{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbar{position:sticky;bottom:14px;margin-top:14px;display:flex;align-items:center;gap:8px;background:#1f2937;color:#fff;border-radius:10px;padding:8px 10px 8px 16px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:13px}
.selbar .btn{background:#374151;border-color:#4b5563;color:#fff}
.selbar .btn:hover{background:#4b5563}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.38);display:flex;align-items:center;justify-content:center;z-index:100;animation:fi .12s}
@keyframes fi{from{opacity:0}}
.dlg{background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:520px;max-width:94vw;max-height:90vh;display:flex;flex-direction:column}
.dlg.wide{width:880px}.dlg.xwide{width:1120px}
.dh{padding:16px 20px 6px;font-weight:650;font-size:16px;display:flex;align-items:center}
.dh .x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;line-height:1;color:#8a919c;width:30px;height:30px;border-radius:8px}
.dh .x:hover{background:#f0f2f5}
.db{padding:10px 20px 14px;overflow:auto}
.df{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px}
.lst{border:1px solid var(--line);border-radius:8px;max-height:320px;overflow:auto}
.lst a,.lst label{display:flex;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line2);color:var(--tx)}
.lst a:last-child,.lst label:last-child{border-bottom:0}
.lst a:hover,.lst label:hover{background:#f7f9fc;text-decoration:none}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
#toast div{background:#1f2937;color:#fff;padding:10px 14px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:420px;font-size:13px;animation:tin .16s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
/* paper */
.paper{background:#fff;border:1px solid #d9dce2;box-shadow:0 4px 18px rgba(0,0,0,.07);width:760px;max-width:100%;margin:0 auto;padding:38px 46px;font:13px/1.38 "Times New Roman",Times,serif;color:#000;border-radius:4px}
.paper h2{text-align:center;font-size:15px;margin:14px 0 4px}
.paper .c{text-align:center}
.paper .pl{border-bottom:1px solid #000;min-height:18px;padding:0 2px}
.paper .pc{font-size:10px;text-align:center;color:#333;margin-bottom:6px}
.paper .miss{color:#c00;background:#fee}
.paper table{border-collapse:collapse;width:100%}
.paper td{vertical-align:top}
.sheetwrap{background:#eef0f3;border-radius:8px;padding:14px;display:flex;justify-content:center}
.sheetwrap svg{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);max-width:100%;height:auto}
/* photos */
.phg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pht{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.pht .img{height:130px;background:#e6eaef center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#8a95a3;font-size:12px}
.pht textarea{border:0;border-top:1px solid var(--line2);border-radius:0;font-size:12.5px;min-height:54px}
.pht .row{padding:6px 8px;border-top:1px solid var(--line2)}
.pages{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;background:#eef0f3;padding:16px;border-radius:8px}
.pg{width:300px;height:424px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);padding:14px;display:flex;flex-direction:column;font:10px "Times New Roman",serif}
.pg .hh{text-align:center;font-weight:bold;margin-bottom:6px}
.pg .cells{flex:1;display:grid;gap:6px}
.pg .cell{display:flex;flex-direction:column;min-height:0}
.pg .cell .im{flex:1;background:#d9dfe6 center/cover no-repeat;min-height:0}
.pg .cell .cp{font-size:9px;padding-top:2px}
.pg .ft{text-align:right;font-size:9px;margin-top:4px}
/* build */
.blk{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#fff}
.blk .bh{display:flex;align-items:center;gap:8px;padding:6px 8px}
.blk .bh .t{flex:1;font-weight:550;font-size:13.5px}
.blk.off .bh .t{color:#9aa1ab;text-decoration:line-through;font-weight:400}
.blk .bi{padding:0 8px 6px 40px;font-size:12.5px}
.blk .bi div{display:flex;gap:6px;align-items:center;padding:2px 0}
.blk .bi div span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv{border:1px solid #d6dae1;background:#fff;width:22px;height:22px;padding:0;font-size:9px;cursor:pointer;border-radius:5px;color:#5b6370;line-height:1}
.mv:hover{background:var(--acc-s);color:var(--acc)}
pre.tree{background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:12px/1.5 ui-monospace,Consolas,"Courier New",monospace;margin:0;overflow:auto;max-height:360px}
.steps{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.vt{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff;color:var(--tx);min-width:150px}
.vt:hover{border-color:#c6d3ef;text-decoration:none}
.vt.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(36,86,201,.12)}
.vt small{display:block;color:var(--mut)}
.msg{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:13.5px}
.msg:last-child{border-bottom:0}
.msg:hover{background:#f7f9fc}
.msg i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.msg.e i{background:var(--red)}.msg.w i{background:#e0a100}
.kv{display:grid;grid-template-columns:190px 1fr;gap:6px 14px;font-size:13.5px}
.kv>div:nth-child(odd){color:var(--mut)}
code.tag{background:#eef2f9;border-radius:5px;padding:1px 6px;font:12.5px ui-monospace,Consolas,monospace;color:#23415f}
.ro-banner{background:#fff3cd;color:#5c4600;padding:7px 24px;font-size:13px;border-bottom:1px solid #f0dc95}
.mi-menu{position:absolute;right:20px;top:52px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px;min-width:250px;z-index:60}
.mi-menu a{display:block;padding:8px 10px;border-radius:7px;color:var(--tx2)}
.mi-menu a:hover{background:#f3f5f8;text-decoration:none}
.mi-menu hr{border:0;border-top:1px solid var(--line2);margin:5px 0}
@media (max-width:1000px){#app{grid-template-columns:240px 1fr}.g3,.g4,.cols,.kpis{grid-template-columns:1fr 1fr}.page{padding:18px}}
#app.bare{grid-template-columns:1fr}#app.bare #side,#app.bare #top,#app.bare #status{display:none}#app.bare #content{background:var(--bg)}
#status{height:28px;flex:none;display:flex;align-items:center;gap:18px;padding:0 16px;background:#fff;border-top:1px solid var(--line);font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden}
#status .si{display:inline-flex;align-items:center;gap:6px;flex:none}#status .si.shr{flex:0 1 auto;min-width:0;overflow:hidden}#status .si.shr2{flex-shrink:4}#status .si.shr span{overflow:hidden;text-overflow:ellipsis}#status .si.cl{cursor:pointer}#status .si.cl:hover{color:var(--acc)}#status .ic{width:13px;height:13px;flex:none}

/* ---------- проверка комплектности объекта ---------- */
function check(p){const E=[],W=[];if(!p)return{E,W};const mids=new Set(p.materials.map(m=>m.id));const usedPf=new Set();
 p.systems.forEach(s=>{const SL='#/s/'+s.id;
  s.subprofiles.forEach(sp=>{if(sp.profileId)usedPf.add(sp.profileId)});
  const nums={};
  s.acts.forEach(a=>{const L='#/a/'+a.id,N=`${s.code} · ${a.num}`;(nums[a.num]=nums[a.num]||[]).push(a);
   a.materials.forEach(m=>{if(!mids.has(m))E.push({t:`${N}: ссылка на удалённый материал`,l:L+'/mat'})});
   a.schemes.forEach(x=>{if(!x.file)E.push({t:`${N}: у схемы «${x.name}» нет файла PDF`,l:L+'/att'})});
   a.tests.forEach(t=>{if(!t.file)E.push({t:`${N}: у приложения «${t.name||'без названия'}» нет файла`,l:L+'/att'})});
   const req=new Set();a.subs.forEach(id=>{const pf=prof(spOf(s,id)?.profileId);pf?.reqFields.forEach(f=>req.add(f))});
   req.forEach(f=>{if(!String(a[f]||'').trim())E.push({t:`${N}: не заполнено обязательное поле «${FIELD_NAMES[f]}»`,l:L})});
   if(!a.subs.length)W.push({t:`${N}: акт не входит ни в один комплект (подпрофиль) и не попадёт в том`,l:L});
   a.materials.filter(m=>mids.has(m)).forEach(m=>{if(!a.aikLinks[m]||!s.aik.some(k=>k.id===a.aikLinks[m]))W.push({t:`${N}: материал «${mName(pMat(p,m))}» без привязанного АИК`,l:L+'/mat'})});
   if(a.date&&a.end&&a.date<a.end)W.push({t:`${N}: дата акта (${fmtD(a.date)}) раньше окончания работ (${fmtD(a.end)})`,l:L});
   if(a.start&&a.end&&a.end<a.start)W.push({t:`${N}: окончание работ раньше начала`,l:L});
   a.subs.forEach(id=>{const sp=spOf(s,id);DOC_ROLES.forEach((r,i)=>{if(!signer(a,sp,i))W.push({t:`${N}: не назначен «${ROLE_SH[i]}» (${sp?.name})`,l:L+'/main'})})});
  });
  Object.entries(nums).forEach(([k,v])=>{if(v.length>1)W.push({t:`${s.code}: повторяется номер ${k} (${v.length} акта)`,l:'#/a/'+v[1].id})});
  s.aik.forEach(k=>{if(!mids.has(k.materialId))E.push({t:`${s.code} · ${k.num}: ссылка на удалённый материал`,l:'#/k/'+k.id})});
 });
 p.materials.forEach(m=>{if(m.baseId&&!baseOf(m))E.push({t:`Материал ссылается на удалённую позицию базы паспортов`,l:'#/m/'+m.id});else if(!mDocs(m).length)W.push({t:`Материал «${mName(m)}» без документов качества`,l:'#/m/'+m.id})});
 for(let i=0;i<p.materials.length;i++)for(let j=i+1;j<p.materials.length;j++)if(similar(mName(p.materials[i]),mName(p.materials[j])))W.push({t:`Похожие материалы: «${mName(p.materials[i])}» и «${mName(p.materials[j])}»`,l:'#/m/'+p.materials[j].id});
 const files={};const addF=(f,l)=>{if(f)(files[f]=files[f]||[]).push(l)};
 p.systems.forEach(s=>{addF(s.scheme.file,'#/s/'+s.id+'/scheme');s.acts.forEach(a=>{a.schemes.forEach(x=>addF(x.file,'#/a/'+a.id+'/att'));a.tests.forEach(t=>addF(t.file,'#/a/'+a.id+'/att'))})});
 Object.entries(files).forEach(([f,v])=>{if(v.length>1)W.push({t:`Один и тот же PDF «${f}» включён ${v.length} раза`,l:v[0]})});
 S.lib.profiles.filter(x=>usedPf.has(x.id)).forEach(x=>x.reqDocs.forEach(t=>{if(!x.templates.some(id=>tpl(id)?.type===t))E.push({t:`Профиль «${x.name}» v${x.version}: нет шаблона обязательного документа «${t}»`,l:'#/lib/profiles/'+x.id})}));
 {const lp=maxPath(vObj(p),APP.current);if(lp.len>240)W.push({t:`Длинный путь к файлу (${lp.len} симв., предел Windows ~260): сократите краткое название объекта или имена файлов — ${cut(lp.path,90)}`,l:'#/p/'+p.id+'/files'})}
 return{E,W}}

 sortedSys(p).forEach(s=>s.subprofiles.forEach(sp=>{i++;v.push({key:'T2_'+sp.id,kind:'T2',title:`Том 2.${i}. ${s.code} — ${s.name}${s.subprofiles.length>1?' ('+sp.name+')':''}`,short:`Том 2.${i} ${s.code}`,sub:s.subprofiles.length>1?sp.name:s.name,s,sp})}));
 v.push({key:'T3',kind:'T3',title:'Том 3. ИД для эксплуатации',short:'Том 3',sub:'Для эксплуатации'});return v}
function qItems(m){return mDocs(m).map(d=>({id:'q'+d.id,type:d.type,name:`${d.type}: ${mName(m)}`,nd:`№ ${d.num||'—'} от ${fmtD(d.date)}`,pages:+d.pages||1,file:d.file,folder:'Документы_качества'}))}
function actItem(a,s){const sc=a.scan?.file;return{id:'a'+a.id,type:a.type+(sc?' (скан)':''),name:a.works,nd:`№ ${a.num} от ${fmtD(a.date)}`,pages:sc?(+a.scan.pages||2):2,file:sc||s.code+'_'+a.num+'.pdf',ref:'#/a/'+a.id}}
function blocksFor(p,vol){const B=[];const pf=vol.sp?prof(vol.sp.profileId):null;const rule=pf?.quality||'once';
 const title={key:'title',title:'Титульный лист',items:[{id:'title',type:'Титульный лист',name:vol.title,nd:'',pages:1,file:'Титульный_лист.docx'}]};
 const reg={key:'reg',title:vol.kind==='T3'?'Опись':'Реестр (опись) документов',items:[],auto:true};
 const jItem=j=>({id:'j'+j.id,type:'Журнал',name:j.name,nd:j.mode==='B'?'PDF (скан)':'По РД-11-05-2007',pages:j.mode==='B'?(+j.pages||1):2+Math.ceil(j.rows.length/10),file:j.mode==='B'?j.file:slug(j.name)+'.pdf',ref:'#/j/'+j.id});
 const mat=id=>pMat(p,id);
 if(vol.kind==='T1'){B.push(title,reg);
  B.push({key:'orders',title:'Приказы о назначении ответственных лиц, допуски СРО',items:S.lib.orders.map(o=>({id:'o'+o.id,type:'Приказ / доверенность',name:o.name,nd:`№ ${o.num} от ${fmtD(o.date)}`,pages:+o.pages||1,file:o.file}))});
  B.push({key:'ozhr',title:'Общий журнал работ (ОЖР)',items:p.journals.filter(j=>j.kind.startsWith('Общий')).map(jItem)});
  B.push({key:'spj',title:'Специальные журналы объекта',items:p.journals.filter(j=>!j.kind.startsWith('Общий')).map(jItem)});
  const ms=[...new Set(p.systems.flatMap(s=>s.acts.flatMap(a=>a.materials)))].map(mat).filter(Boolean);
  B.push({key:'quality',title:'Паспорта, сертификаты, декларации',items:ms.flatMap(qItems)});
  B.push({key:'aook',title:'Акты освидетельствования ответственных конструкций (АООК)',items:p.systems.flatMap(s=>sortActs(s.acts.filter(a=>a.type==='АООК')).map(a=>actItem(a,s)))});
  B.push({key:'survey',title:'Исполнительные съёмки (геодезия)',items:p.surveys.map(x=>({id:'v'+x.id,type:'Исполнительная съёмка',name:x.name,nd:`№ ${x.num} от ${fmtD(x.date)}`,pages:+x.pages||1,file:x.file}))});
 }else if(vol.kind==='T2'){const s=vol.s;const acts=sortActs(s.acts.filter(a=>a.type==='АОСР'&&a.subs.includes(vol.sp.id)));B.push(title,reg);
  B.push({key:'aik',title:'Акты входного контроля (АИК)',items:s.aik.map(k=>({id:'k'+k.id,type:'АИК',name:'Входной контроль: '+(mName(mat(k.materialId))||'[удалён]'),nd:`№ ${k.num} от ${fmtD(k.date)}`,pages:1,file:k.num+'.pdf',ref:'#/k/'+k.id}))});
  const seen=new Set(),ai=[];
  acts.forEach(a=>{ai.push(actItem(a,s));if(a.photos.length)ai.push({id:'p'+a.id,type:'Фототаблица',name:`Фототаблица к ${a.num}`,nd:'',pages:photoSheets(a),file:'Фототаблица_к_'+a.num+'.pdf',sub:true,ref:'#/a/'+a.id+'/att'});
   if(rule!=='once')a.materials.map(mat).filter(Boolean).forEach(m=>{if(rule==='first'&&seen.has(m.id))return;seen.add(m.id);qItems(m).forEach(q=>ai.push({...q,id:q.id+'_'+a.id,sub:true}))})});
  B.push({key:'aosr',title:'АОСР'+(acts.some(a=>a.photos.length)?' + фототаблицы':'')+(rule!=='once'?' + документы качества':''),items:ai});
  const sch=[];if(s.scheme.file)sch.push({id:'ss'+s.id,type:'Исполнительная схема',name:`Исполнительная схема системы ${s.code}`,nd:'общая',pages:+s.scheme.pages||1,file:s.scheme.file?s.scheme.file.replace(/\.pdf$/i,'_со_штампом.pdf'):'[нет файла]',ref:'#/s/'+s.id+'/scheme'});
  acts.forEach(a=>a.schemes.forEach(x=>sch.push({id:'c'+x.id,type:'Исполнительная схема',name:x.name,nd:'к '+a.num,pages:+x.pages||1,file:x.file?x.file.replace(/\.pdf$/i,'_со_штампом.pdf'):'[нет файла]',ref:'#/a/'+a.id+'/att'})));
  B.push({key:'schemes',title:'Исполнительные схемы (со штампами)',items:sch});
  B.push({key:'tests',title:'Акты испытаний, протоколы',items:acts.flatMap(a=>a.tests.map(t=>({id:'t'+t.id,type:'Акт испытаний / протокол',name:t.name,nd:`№ ${t.num||'—'} от ${fmtD(t.date)}`,pages:+t.pages||1,file:t.file||'[нет файла]',ref:'#/a/'+a.id+'/att'})))});
  B.push({key:'spj',title:'Специальные журналы системы',items:s.journals.map(jItem)});
  if(rule==='once'){const ms=[...new Set(acts.flatMap(a=>a.materials))].map(mat).filter(Boolean);B.push({key:'quality',title:'Паспорта, сертификаты, декларации',items:ms.flatMap(qItems)})}
 }else{B.push(title,reg);
  const eq=p.materials.filter(m=>['Оборудование','Отопительный прибор','Арматура'].includes(mF(m,'category')));
  B.push({key:'pass',title:'Паспорта на оборудование',items:eq.flatMap(m=>qItems(m).filter(q=>q.type==='Паспорт'))});
  B.push({key:'instr',title:'Инструкции, схемы, журналы пусконаладки',items:p.opsDocs.map(o=>({id:'op'+o.id,type:'Документ для эксплуатации',name:o.name,nd:o.num?'№ '+o.num:'',pages:+o.pages||1,file:o.file}))});}
 const cfg=S.volCfg[p.id+'|'+vol.key]||{};
 if(cfg.order)B.sort((a,b)=>{const ia=cfg.order.indexOf(a.key),ib=cfg.order.indexOf(b.key);return(ia<0?99:ia)-(ib<0?99:ib)});
 B.forEach(b=>{b.off=(cfg.off||[]).includes(b.key);const ord=(cfg.docs||{})[b.key];if(ord)b.items.sort((x,y)=>{const i1=ord.indexOf(x.id),i2=ord.indexOf(y.id);return(i1<0?999:i1)-(i2<0?999:i2)})});
 const total=B.filter(b=>!b.off&&!b.auto).reduce((n,b)=>n+b.items.length,0);
 const r=B.find(b=>b.auto);if(r)r.items=[{id:'reg',type:'Реестр',name:r.title,nd:'',pages:Math.max(1,Math.ceil((total+1)/22)),file:'Реестр.docx'}];
 return B}
function registry(p,vol){const B=blocksFor(p,vol);const rows=[];let pg=1,n=0,book=1;const lim=+S.splitPages||0;
 B.filter(b=>!b.off).forEach(b=>b.items.forEach(it=>{if(lim&&!rows.length)rows.push({book:1});else if(lim&&pg-1+it.pages>lim&&pg>1){book++;pg=1;rows.push({book})}n++;rows.push({...it,n,from:pg,to:pg+it.pages-1});pg+=it.pages}));
 return{B,rows,pages:rows.filter(r=>!r.book).reduce((s,r)=>s+r.pages,0),books:book}}
function folderTree(p,vol){const{B}=registry(p,vol);const name=slug(vol.short);let out=name+'/\n├── '+name+'_ИД.pdf   (итоговый файл)\n';const act=B.filter(b=>!b.off&&b.items.length);
 act.forEach((b,i)=>{const last=i===act.length-1;const no=String(i+1).padStart(2,'0');
  if(b.key==='title'||b.key==='reg'){out+=(last?'└── ':'├── ')+no+'_'+(b.key==='title'?'Титульный_лист.docx':'Реестр.docx')+'\n';return}
  out+=(last?'└── ':'├── ')+no+'_'+slug(b.title.split(' (')[0].split(' +')[0])+'/\n';
  const its=b.items.slice(0,4);its.forEach((it,j)=>{out+=(last?'    ':'│   ')+(j===its.length-1&&b.items.length<=4?'└── ':'├── ')+slug(it.file||it.name)+'\n'});
  if(b.items.length>4)out+=(last?'    ':'│   ')+'└── … ещё '+(b.items.length-4)+'\n'});
 return out}

const cut=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
function stampRect(sc,w,h){const sw=120,sh=46;const p=sc.pos;let x,y;
 if(p==='Правый верхний угол'){x=w-5-sw-3;y=8}else if(p==='Левый верхний угол'){x=23;y=8}else if(p==='Над основной надписью'){x=w-5-185;y=h-5-55-sh-4}else if(p==='Левый нижний угол'){x=23;y=h-5-sh-3}else{x=20+(w-25-sw)*(+sc.mx||0)/100;y=5+(h-10-sh)*(+sc.my||0)/100}
 return{x,y,sw,sh}}
function sheetSvg(sc,o){const fmt=sc.format==='авто'?'A3':sc.format;let[w,h]={A4:[210,297],A3:[297,420],A2:[420,594],A1:[594,841]}[fmt]||[297,420];if(sc.orient==='Альбомная')[w,h]=[h,w];
 const ex=person(o.execId);const R=stampRect(sc,w,h);const tb={x:w-5-185,y:h-5-55,w:185,h:55};
 const ov=!(R.x+R.sw<tb.x||R.x>tb.x+tb.w||R.y+R.sh<tb.y||R.y>tb.y+tb.h);
 let g='';for(let i=0;i<6;i++){const xx=30+i*(w-60)/5;g+=`<line x1="${xx}" y1="20" x2="${xx}" y2="${h-70}" stroke="#bbb" stroke-dasharray="6 2 1 2" stroke-width=".4"/><circle cx="${xx}" cy="16" r="4" fill="none" stroke="#999" stroke-width=".4"/><text x="${xx}" y="17.5" font-size="4" text-anchor="middle" fill="#777">${i+1}</text>`}
 g+=`<polyline points="40,${h*.55} ${w*.35},${h*.55} ${w*.35},${h*.3} ${w*.7},${h*.3}" fill="none" stroke="#1a5fb4" stroke-width="1.4"/><polyline points="40,${h*.62} ${w*.45},${h*.62} ${w*.45},${h*.4} ${w*.75},${h*.4}" fill="none" stroke="#c0392b" stroke-width="1.4"/>`;
 const st=`<g><rect x="${R.x}" y="${R.y}" width="${R.sw}" height="${R.sh}" fill="#fff" stroke="${ov?'#d00':'#0b3d91'}" stroke-width="${ov?1.2:.6}"/>
  <text x="${R.x+R.sw/2}" y="${R.y+7}" font-size="4.6" font-weight="bold" text-anchor="middle" fill="#0b3d91">ИСПОЛНЕНО ПО РАБОЧИМ ДОКУМЕНТАМ</text>
  <text x="${R.x+3}" y="${R.y+14}" font-size="3.6" fill="#0b3d91">шифр: ${esc(cut(sc.rd,52))}</text>
  <text x="${R.x+3}" y="${R.y+20}" font-size="3.6" fill="#0b3d91">Отклонения: ${esc(cut(sc.tol,48))}</text>
  <text x="${R.x+3}" y="${R.y+26}" font-size="3.6" fill="#0b3d91">${esc(cut(org(ex?.orgId)?.short||'',40))}</text>
  <text x="${R.x+3}" y="${R.y+32}" font-size="3.6" fill="#0b3d91">${esc(cut(ex?.position||'Исполнитель не выбран',40))}</text>
  <text x="${R.x+3}" y="${R.y+40}" font-size="3.6" fill="#0b3d91">${esc(ex?.fioShort||'')}   ________   ${fmtD(o.date)}</text></g>`;

async function zipRead(file,re){const buf=new Uint8Array(await file.arrayBuffer());const dv=new DataView(buf.buffer);let e=-1;for(let i=buf.length-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}if(e<0)return{};
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};
 for(let k=0;k<n;k++){const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);const name=new TextDecoder().decode(buf.slice(p+46,p+46+nl));p+=46+nl+xl+cl;
  if(!re.test(name))continue;const ln=dv.getUint16(lo+26,true),lx=dv.getUint16(lo+28,true);const data=buf.slice(lo+30+ln+lx,lo+30+ln+lx+cs);
  if(meth===0)out[name]=new TextDecoder().decode(data);else{const ds=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));out[name]=await new Response(ds).text()}}
 return out}

const LOGO=`<svg width="40" height="40" viewBox="0 0 32 32" fill="none" aria-label="СтройИД"><rect width="32" height="32" rx="8" fill="#2456c9"/><path d="M9 23V13.5L16 9l7 4.5V23" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M13 23v-5h6v5" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="23.5" cy="8.5" r="2.5" fill="#ffc94a"/></svg>`;
const PULSE_MIN=2,STALE_MIN=30;

/* ---------- метки редактирования (.locks/ИМЯ_КОМПЬЮТЕР.json) ---------- */
const isMe=l=>l.user===APP.user&&l.pc===APP.pc;
const isFresh=l=>Date.now()-Date.parse(l.pulse)<STALE_MIN*60e3;
const agoS=s=>{const m=Math.max(0,Math.round((Date.now()-Date.parse(s))/60e3));return m<60?m+' мин':Math.floor(m/60)+' ч '+(m%60)+' мин'};
function lockInfo(key){const L=S.locks[key]||[];const fr=L.filter(isFresh).sort((a,b)=>a.since.localeCompare(b.since));const owner=fr[0]||null;
 return{mine:L.find(isMe)||null,owner,blockedBy:owner&&!isMe(owner)?owner:null,stale:L.filter(l=>!isMe(l)&&!isFresh(l))}}
function lockName(key){if(!key)return'';const[t,id]=key.split(':');if(t==='sys')return'систему '+(getEnt('sys',id)?.code||'');if(t==='obj')return'общие данные объекта «'+(proj(id)?.name||'')+'»';return'справочники'}
function routeKey(){if(!S)return null;const r=route();const k=r[0],id=r[1];const X=ix();
 if(k==='s')return X.sys[id]?'sys:'+id:null;if(k==='a')return X.act[id]?'sys:'+X.act[id].s.id:null;if(k==='k')return X.aik[id]?'sys:'+X.aik[id].s.id:null;
 if(k==='j'){const e=X.jr[id];return e?(e.s?'sys:'+e.s.id:'obj:'+e.p.id):null}if(k==='p')return X.proj[id]?'obj:'+id:null;if(k==='m')return X.mat[id]?'obj:'+X.mat[id].p.id:null;
 if(k==='lib')return'lib';return null}
function entKey(ent,id){if(['ui','root','app'].includes(ent))return null;if(LIBK[ent])return'lib';if(ent==='proj')return'obj:'+id;if(ent==='sys')return'sys:'+id;const c=ctx(ent,id);
 if(ent==='mat')return c.p?'obj:'+c.p.id:null;if(c.s)return'sys:'+c.s.id;if(c.p)return'obj:'+c.p.id;return null}
function takeLock(key){const L=S.locks[key]=S.locks[key]||[];let m=L.find(isMe);const isNew=!m;if(!m){m={user:APP.user,pc:APP.pc,since:iso(),pulse:iso()};L.push(m)}else m.pulse=iso();
 if(isNew&&key===routeKey()&&!$('#content .lockbar')){$('#content').insertAdjacentHTML('afterbegin',lockBar(key));renderTree();renderStatus()}}
function releaseMine(keep){if(!S||!S.locks)return false;let ch=false;Object.keys(S.locks).forEach(k=>{if(k===keep)return;const n=S.locks[k].length;S.locks[k]=S.locks[k].filter(l=>!isMe(l));if(S.locks[k].length!==n)ch=true;if(!S.locks[k].length)delete S.locks[k]});return ch}
function childLockedBy(key){const[t,id]=key.split(':');const keys=[key];if(t==='obj'){const p=proj(id);p?.systems.forEach(s=>keys.push('sys:'+s.id))}for(const k of keys){const L=S.locks[k]?lockInfo(k):null;if(L&&L.blockedBy)return{k,l:L.blockedBy}}return null}
function lockBar(key){if(!key||!S.locks[key])return'';const L=lockInfo(key);const n=esc(lockName(key));
 if(L.blockedBy)return`<div class="lockbar o">${ic('lock')}<span class="grow">Только просмотр: ${n} сейчас редактирует <b>${esc(L.blockedBy.user)}</b> (${esc(L.blockedBy.pc)}) с ${hm(L.blockedBy.since)}. Изменения появятся у вас автоматически.</span></div>`;
 if(L.stale.length&&!L.mine){const x=L.stale[0];return`<div class="lockbar s">${ic('lock')}<span class="grow">Брошенная метка: <b>${esc(x.user)}</b> (${esc(x.pc)}) — нет пульса ${esc(agoS(x.pulse))}. Снимите метку, чтобы редактировать ${n}.</span>${B('Снять метку','lockStale',`data-k="${key}"`,'sm')}</div>`}
 if(L.mine)return`<div class="lockbar m">${ic('lock')}<span class="grow">Вы редактируете ${n} с ${hm(L.mine.since)} — у коллег открыто только для просмотра.</span>${B('Завершить редактирование','lockRelease',`data-k="${key}"`,'sm')}</div>`;
 return''}
function lockMark(key){if(!S.locks[key])return'';const L=lockInfo(key);
 if(L.blockedBy)return`<span class="lk o" title="Редактирует ${esc(L.blockedBy.user)} (${esc(L.blockedBy.pc)}) с ${hm(L.blockedBy.since)}">${ic('lock','')}</span>`;
 if(L.mine)return`<span class="lk m" title="Вы редактируете">${ic('lock','')}</span>`;
 if(L.stale.length)return`<span class="lk s" title="Брошенная метка: ${esc(L.stale[0].user)}, нет пульса ${esc(agoS(L.stale[0].pulse))}">${ic('lock','')}</span>`;return''}

function imp(){return S.ui.imp=S.ui.imp||{src:'',step:1,pid:S.projects[0]?.id||'',sid:'',path:'',rows:[],cols:[],map:{},res:null}}
const actNum=s=>{const m=String(s).match(/(АОСР|АООК)[-_ ]?(\d+)/i);return m?m[1].toUpperCase()+'-'+pad(+m[2]):''};
function recog(path,p){const parts=path.split('/');const file=parts[parts.length-1];const base=file.replace(/\.[^.]+$/,'');const s=p.systems.find(x=>x.code.toLowerCase()===parts[0].toLowerCase());const num=actNum(base);
 const r={file:path,on:true,sid:s?.id||'',num,type:'skip',name:''};
 if(/\.(jpe?g|png)$/i.test(file))r.type=num?'photo':'skip';else if(/^ИС\s*к\s/i.test(base))r.type='actScheme';else if(/протокол|испытан/i.test(base))r.type='test';else if(/^(АОСР|АООК)/i.test(base)){r.type='scan';r.name=base.replace(/^(АОСР|АООК)[-_ ]?\d+\s*/i,'')}
 else if(/^ИС[_ ]/i.test(base))r.type='sysScheme';else if(/сертификат|паспорт|декларац/i.test(base)){r.type='quality';r.name=base.replace(/^(Сертификат|Паспорт|Декларация)\s*/i,'')}
 if(r.type==='skip')r.on=false;r.name=r.name||base;return r}
function recogPass(file){const base=file.replace(/\.[^.]+$/,'');const t=/^паспорт/i.test(base)?'Паспорт':/^декларац/i.test(base)?'Декларация о соответствии':'Сертификат соответствия';const name=base.replace(/^(Сертификат|Паспорт|Декларация)_?/i,'').replace(/_/g,' ').replace(/-/g,'/').trim();const sim=S.lib.base.find(b=>similar(b.name,name));
 return{file,on:true,name,type:t,num:'',target:sim?sim.id:'new'}}
const pDate=v=>{v=String(v||'').trim();let m=v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');if(/^\d{5}(\.\d+)?$/.test(v))return new Date(Date.UTC(1899,11,30)+Math.floor(+v)*864e5).toISOString().slice(0,10);if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;return''};
function parseCSV(t){t=t.replace(/^\ufeff/,'');const h=t.split('\n')[0];const dl=(h.match(/;/g)||[]).length>=(h.match(/,/g)||[]).length?';':(h.includes('\t')?'\t':',');const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===dl){row.push(cur);cur=''}else if(c==='\n'){row.push(cur.replace(/\r$/,''));rows.push(row);row=[];cur=''}else cur+=c}
 if(cur||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()))}
const unx=s=>s.replace(/&#(\d+);/g,(m,n)=>String.fromCodePoint(+n)).replace(/&#x([0-9a-f]+);/gi,(m,n)=>String.fromCodePoint(parseInt(n,16))).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
async function xlsxRows(file){const z=await zipRead(file,/^xl\/(sharedStrings\.xml|worksheets\/sheet1\.xml)$/);const ss=[...(z['xl/sharedStrings.xml']||'').matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m=>unx([...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join('')));
 const out=[];[...(z['xl/worksheets/sheet1.xml']||'').matchAll(/<row[^>]*>([\s\S]*?)<\/row>/g)].forEach(m=>{const row=[];[...m[1].matchAll(/<c ([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)].forEach(c=>{const ref=(c[1].match(/r="([A-Z]+)/)||[])[1]||'A';const t=(c[1].match(/t="(\w+)"/)||[])[1];let v=((c[2]||'').match(/<v>([\s\S]*?)<\/v>/)||[])[1];
  if(t==='s')v=ss[+v];else if(t==='inlineStr')v=unx(((c[2]||'').match(/<t[^>]*>([\s\S]*?)<\/t>/)||[])[1]||'');else v=unx(v||'');let ci=0;for(const ch of ref)ci=ci*26+ch.charCodeAt(0)-64;row[ci-1]=v});out.push([...row].map(x=>x??''))});return out.filter(r=>r.some(x=>String(x).trim()))}

function impPlan(I){const p=proj(I.pid);const out=[];if(!p&&I.src!=='pass')return out;
 if(I.src==='folder'){const planned={};I.rows.forEach(r=>{if(r.on&&r.type==='scan'&&r.sid&&r.num)(planned[r.sid]=planned[r.sid]||new Set()).add(r.num)});
  I.rows.forEach((r,i)=>{if(!r.on||r.type==='skip')return;const s=p.systems.find(x=>x.id===r.sid);const fn=r.file.split('/').pop();
   if(r.type==='quality'){const b=blkBy('obj:'+p.id);out.push(b?{ok:0,t:`${fn}: общие данные объекта редактирует ${b.user} — пропуск`}:{ok:1,t:`Материал «${r.name}»: свой материал объекта с документом ${fn}`});return}
   if(!s){out.push({ok:0,t:`${fn}: не выбрана система — будет пропущен`});return}
   {const b=blkBy('sys:'+s.id);if(b){out.push({ok:0,t:`${fn}: систему ${s.code} сейчас редактирует ${b.user} — пропуск, повторите позже`});return}}

   const a=s.acts.find(x=>x.num===r.num);const willBe=planned[s.id]?.has(r.num);
   if(r.type==='scan'){out.push({ok:1,t:a?`${s.code} · ${r.num}: скан приложится к существующему акту`:`${s.code} · ${r.num}: создаётся акт «${r.name}» со сканом`});return}
   if(!r.num||(!a&&!willBe)){out.push({ok:0,t:`${fn}: не найден акт ${r.num||'(укажите номер)'} — будет пропущен`});return}
   out.push({ok:1,t:`${s.code} · ${r.num}: ${r.type==='actScheme'?'своя схема':r.type==='test'?'акт испытаний':'фото'} — ${fn}`})})}
 if(I.src==='excel'){const g=f=>I.map[f]===''||I.map[f]==null?null:+I.map[f];if(g('num')==null||g('works')==null){out.push({ok:0,t:'Укажите колонки «Номер акта» и «Наименование работ»'});return out}const seen=new Set();
  I.rows.forEach(r=>{const num=actNum(r.c[g('num')])||String(r.c[g('num')]).trim();const code=g('sys')!=null?String(r.c[g('sys')]).trim():'';const s=I.sid?p.systems.find(x=>x.id===I.sid):p.systems.find(x=>x.code.toLowerCase()===code.toLowerCase());
   if(!s){out.push({ok:0,t:`${num}: система «${code||'—'}» не найдена в объекте — пропуск`});return}const k=s.id+num;
   {const b=blkBy('sys:'+s.id);if(b){out.push({ok:0,t:`${s.code} · ${num}: систему редактирует ${b.user} — пропуск`});return}}
   if(s.acts.some(a=>a.num===num)||seen.has(k)){out.push({ok:0,t:`${s.code} · ${num}: такой номер уже есть — пропуск`});return}seen.add(k);out.push({ok:1,t:`${s.code} · ${num}: ${r.c[g('works')]}`,s,num,r})})}
 if(I.src==='pass')I.rows.forEach(r=>{if(!r.on)return;const b=S.lib.base.find(x=>x.id===r.target);out.push({ok:1,t:b?`«${b.name}»: добавится документ ${r.type}`:`Новая позиция базы «${r.name}» с документом ${r.type}`})});
 return out}

 const entries=[],owned=new Set((a.schemes||[]).map(x=>x.id)),linked=new Map();

A.importJson=async()=>{if(!guard(null))return;const[f]=await pickFiles('.json');if(!f)return;try{const d=JSON.parse(await f.text());if(d.meta?.v!==30||!Array.isArray(d.projects)||!d.lib||!Array.isArray(d.lib.orgs)||!Array.isArray(d.lib.people)||!Array.isArray(d.lib.base)||!Array.isArray(d.lib.profiles)||!Array.isArray(d.lib.templates))throw Error('неверный формат');for(const p of d.projects){if(!Array.isArray(p.systems)||!Array.isArray(p.materials)||!Array.isArray(p.journals)||!Array.isArray(p.surveys)||!Array.isArray(p.opsDocs))throw Error('неполная структура объекта');for(const s of p.systems)if(!s.scheme||!Array.isArray(s.acts)||!Array.isArray(s.aik)||!Array.isArray(s.journals)||!Array.isArray(s.subprofiles))throw Error('неполная структура системы');}backup('Перед открытием проекта');d.locks={};d.ui=S.ui;d.trash=d.trash||[];d.history=d.history||[];d.volCfg=d.volCfg||{};S=d;IX=null;ensureWorkspace();logH('Открыт проект '+f.name);save();go('#/home');render();toast('Проект открыт. Файлы из другого браузера нужно загрузить отдельно.');}catch(e){toast('Проект не открыт: '+e.message);}};
// Agent navigation uses the same contextual workspace as the visible UI.
if(document.modelContext?.registerTool){const abort=new AbortController();for(const tool of [{name:'read_stroiid_structure',description:'Read objects and their systems without changing data.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(!input||Object.keys(input).length)throw Error('No arguments expected');return S.projects.map(p=>({id:p.id,name:p.name,systems:p.systems.map(s=>({id:s.id,code:s.code,acts:s.acts.length,schemes:resourceList(s).length,materials:usedMaterials(s).size}))}));}},{name:'open_stroiid_system_section',description:'Open a specialized register inside the selected engineering system.',inputSchema:{type:'object',properties:{systemId:{type:'string'},section:{type:'string',enum:['overview','acts','schemes','materials','aik','trials','jr']}},required:['systemId','section'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||Object.keys(input).some(k=>!['systemId','section'].includes(k))||!['overview','acts','schemes','materials','aik','trials','jr'].includes(input.section)||!getEnt('sys',input.systemId))throw Error('Unknown system or section');go('#/s/'+input.systemId+'/'+input.section);render();return {system:input.systemId,section:input.section};}}]){try{Promise.resolve(document.modelContext.registerTool(tool,{signal:abort.signal})).catch(()=>{});}catch{}}window.addEventListener('pagehide',()=>abort.abort(),{once:true});}
// Complete page-count checks after uploads and when an original is replaced.
const checkWithLinks=check;check=p=>{const C=checkWithLinks(p);const test=(x,label,l)=>{if(x.file&&(!Number.isInteger(Number(x.pages))||Number(x.pages)<1))C.W.push({t:label+': уточните число страниц исходного файла',l});};p.admin.forEach(x=>test(x,x.name,'#/p/'+p.id+'/admin'));p.systems.forEach(s=>{test(s.scheme,s.code+' · комплект схем','#/s/'+s.id+'/scheme');s.sketches.forEach(x=>test(x,x.name,'#/s/'+s.id+'/schemes'));s.trials.forEach(x=>test(x,x.name,'#/s/'+s.id+'/trials'));s.acts.forEach(a=>{a.schemes.forEach(x=>test(x,a.num+' · '+x.name,'#/a/'+a.id+'/schemes'));a.tests.forEach(x=>test(x,a.num+' · '+x.name,'#/a/'+a.id+'/tests'));if(a.scan)test(a.scan,a.num+' · скан','#/a/'+a.id+'/scan');});});return C;};
// Seed contextual examples; user-created and imported acts require explicit links.
const originalSeedFull=seed;seed=function(){const d=originalSeedFull();d.meta.iaVersion=4;d.projects.forEach((p,i)=>{p.admin=i===0?d.lib.orders.map(x=>({...clone(x),id:'adm'+uid()})):[];p.systems.forEach(s=>{s.sketches=[];s.trials=[];s.materialIds=[];s.acts.forEach((a,j)=>{a.schemeLinks=s.scheme.file&&j<2?[{id:'system',from:1,to:1}]:[];a.testLinks=[];});});});return d;};
// New system sources obey the saved item order after all registers are merged.
const mergedBlocks=blocksFor;blocksFor=(p,vol)=>{const BL=mergedBlocks(p,vol),cfg=S.volCfg[p.id+'|'+vol.key];for(const b of BL){const order=cfg?.docs?.[b.key];if(order)b.items.sort((x,y)=>(order.includes(x.id)?order.indexOf(x.id):1e6)-(order.includes(y.id)?order.indexOf(y.id):1e6));}return BL;};
A.schemeVer=d=>{if(!guard('sys:'+d.s))return;const s=getEnt('sys',d.s),sc=s.scheme,v=sc.versions[Number(d.i)];if(!v)return;confirmBox('Вернуть версию схемы','Текущая версия останется в истории.',()=>{sc.versions.splice(Number(d.i),1);if(sc.file)sc.versions.unshift({file:sc.file,pages:sc.pages,fileKey:sc.fileKey||'',date:sc.updated,by:sc.updatedBy});sc.file=v.file;sc.pages=v.pages;sc.fileKey=v.fileKey||'';sc.stamped=false;sc.updated=nowStr();sc.updatedBy=APP.user;commit('Возвращена версия схемы '+s.code,s)},'Вернуть');};
