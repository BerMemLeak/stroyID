[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stroyid"
version = "0.9.5"
requires-python = ">=3.12"
description = "Desktop executive construction documentation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
